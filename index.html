/* ===== Game flow ===== */
function start(l,demo){
  if(!D[l]||D[l].length<3){lv=l;ov.innerHTML='<div class="card"><h2>Content unavailable</h2><p>This level’s reading bank is missing. Please choose another level.</p><button class="btn" data-a="levels">Levels</button></div>';log('missing bank',l);return}
  lv=l;sv.sel=l;save();W=1;score=rp=books=toks=keys=qF=qOK=0;lives=3;qT=9;area=-1;parts=[];spawn=60;cam=0;
  pl={x:60,y:300,w:22,h:34,vx:0,vy:0,f:1,coy:0,buf:0,inv:0,g:0};
  bks=BK.map(([x,y])=>({x,y,got:0}));tks=TK.map(([x,y],i)=>({x,y,got:0,w:WORDS[l][i]}));key={x:3300,y:262,got:0};
  cps=CP.map((x,i)=>({x,i,s:0,d:D[l][i]}));
  ens=[{x:1260,a:1260,b:1480,d:1},{x:4900,a:4900,b:5200,d:1}];
  hudU();if(demo)return;setState('play');
}
function setState(s){st=s;const p=s==='play';ov.style.display=p?'none':'flex';hud.style.display=p?'flex':'none';ctl.style.display=p?'flex':'none';$('#pg').style.display=p?'block':'none';if(s!=='read')stopSpeak();if(!p)K.l=K.r=K.j=K.jp=0;render();ov.scrollTop=0;const f=ov.querySelector('button,select');if(f&&!p)f.focus({preventScroll:true})}
function hudU(){$('#hs').textContent='Score '+(score+rp);$('#hb').textContent='Books '+books+'/'+BK.length+' · Key '+keys+'/1';const hl=$('#hl');hl.textContent='♥'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));hl.setAttribute('aria-label','Lives '+lives);$('#hc').textContent='Readings '+cps.filter(c=>c.s===2).length+'/3'}
function hit(){if(pl.inv>0)return;lives--;sfx(200,.3,'sawtooth',60);pl.inv=1.6;pl.vy=-380;pl.vx=-pl.f*160;hudU();if(lives<=0)setState('over')}
function fall(){lives--;sfx(200,.3,'sawtooth',60);hudU();if(lives<=0){setState('over');return}pl.x=spawn;pl.y=300;pl.vx=pl.vy=0;pl.inv=1.5;cam=Math.max(0,spawn-VW*.35)}
function burst(x,y,c){if(RM)return;for(let i=0;i<6&&parts.length<60;i++)parts.push({x,y,vx:(Math.random()-.5)*160,vy:-Math.random()*140,l:.5,c})}
function finish(){sfx(660,.5,'triangle',1320);score+=100+lives*20;const tot=score+rp;sv.done[lv]=1;sv.best[lv]=Math.max(sv.best[lv]||0,tot);save();setState('done')}
const hitR=(a,x,y,w,h)=>a.x<x+w&&a.x+a.w>x&&a.y<y+h&&a.y+a.h>y;

function upd(dt){
  const p=pl,d=(K.r?1:0)-(K.l?1:0);
  p.vx+=(d*230-p.vx)*Math.min(1,(d?12:9)*dt);if(d)p.f=d;
  p.coy-=dt;p.buf-=dt;p.inv-=dt;
  if(K.jp){p.buf=.12;K.jp=0}
  if(p.buf>0&&p.coy>0){p.vy=-560;p.buf=0;p.coy=0;sfx(440,.12,'square',760)}
  if(!K.j&&p.vy<-250)p.vy=-250;
  p.vy=Math.min(900,p.vy+1500*dt);
  const ob=p.y+p.h,was=p.g;p.x=Math.max(0,Math.min(L-p.w,p.x+p.vx*dt));p.y+=p.vy*dt;p.g=0;
  for(const q of PL){if(p.vy>=0&&p.x+p.w>q.x+4&&p.x<q.x+q.w-4&&ob<=q.y+6&&p.y+p.h>=q.y){p.y=q.y-p.h;p.vy=0;p.g=1}}
  if(p.g){p.coy=.1;if(!was)burst(p.x+11,p.y+p.h,'#cbb8ff')}
  if(p.y>560){fall();return}
  for(const b of bks)if(!b.got&&hitR(p,b.x-10,b.y-10,20,20)){b.got=1;books++;score+=10;sfx(880,.12,'triangle',1320);burst(b.x,b.y,'#f5b942');hudU()}
  for(const k of tks)if(!k.got&&hitR(p,k.x-12,k.y-12,24,24)){k.got=1;toks++;score+=25;sfx(700,.18,'triangle',1000);burst(k.x,k.y,'#3ddbb0');toast(k.w[0]+' = '+k.w[1],2600);hudU()}
  if(!key.got&&hitR(p,key.x-12,key.y-12,24,24)){key.got=1;keys=1;score+=50;sfx(520,.4,'triangle',1500);toast('Golden key found!');hudU()}
  for(const e of ens){e.x+=e.d*60*dt;if(e.x>e.b||e.x<e.a)e.d*=-1;if(hitR(p,e.x+3,356,22,24)&&p.inv<=0)hit()}
  for(const s of SPK)if(hitR(p,s+4,364,28,16)&&p.inv<=0)hit();
  if(st!=='play')return;
  for(const c of cps)if(c.s===0&&Math.abs(p.x+11-c.x)<32&&p.g){c.s=1;spawn=c.x-40;K.l=K.r=K.j=0;p.vx=0;rd={c,qi:0};prepQ();setState('read');return}
  if(p.x+11>GATE){if(keys>=1&&cps.every(c=>c.s===2)){finish();return}p.x=GATE-34;p.vx=0;if(gT<=0){toast(keys<1?'Find the golden key first':'Finish all 3 readings first',2200);gT=2}}
  gT-=dt;
  const a=Math.min(5,p.x/900|0);if(a!==area){area=a;toast(AREA[a],2200)}
  cam+=(Math.max(0,Math.min(L-VW,p.x-VW*.35))-cam)*Math.min(1,6*dt);
  for(const q of parts){q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=400*dt}parts=parts.filter(q=>q.l>0);
}

/* ===== Reading checkpoint ===== */
function prepQ(){const q=rd.c.d[2][rd.qi];rd.q=q;rd.o=shuf(q[1].map((x,i)=>({t:x,ok:i===0})));rd.tr=0;rd.done=0;rd.sel=[];rd.msg=''}
function readHTML(){
  const c=rd.c,q=rd.q,n=c.d[2].length;
  return `<div class="card qcard"><h2>${esc(c.d[0])}</h2><div class="pass" dir="ltr">${esc(c.d[1])}</div>
<button class="btn" data-a="listen">🔊 ${t('listen')}</button><p dir="ltr"><b>Question ${rd.qi+1} of ${n}: ${esc(q[0])}</b></p>`+
  rd.o.map((o,i)=>{const bad=rd.sel.includes(i),good=rd.done&&o.ok;return `<button class="btn opt ${good?'ok':bad?'bad':''}" dir="ltr" data-a="opt" data-i="${i}" ${(rd.done||bad)?'disabled':''}>${good?'✓ ':bad?'✗ ':''}${esc(o.t)}</button>`}).join('')+
  (rd.msg?`<div class="fb" id="fb" role="status">${rd.msg}</div>`:'')+
  (rd.done?`<button class="btn pri" data-a="next">${rd.qi<n-1?t('next'):t('cont')}</button>`:'')+'</div>';
}
function answer(i){
  const o=rd.o[i],q=rd.q;if(rd.done||!o)return;rd.tr++;
  if(o.ok){rd.done=1;qOK++;if(rd.tr===1){qF++;rp+=50}else rp+=20;sfx(660,.2,'triangle',990);rd.msg='<b>✓ '+t('ok')+'</b> '+esc(q[2])}
  else{rd.sel.push(i);sfx(220,.25,'sawtooth',150);
    if(rd.tr>=2){rd.done=1;rd.msg='<b>✗</b> '+esc(q[2])}else rd.msg='✗ '+t('no')+'<br>💡 '+t('hint')+': '+esc(q[3])+'<br>'+t('retry')+'.'}
  hudU();render();const f=$('#fb');if(f)f.scrollIntoView({block:'nearest'});
}

/* ===== Screens ===== */
function render(){
  const acc=qT?Math.round(100*qF/qT):0,fin=qT?Math.round(100*qOK/qT):0,H={
  menu:()=>`<div class="card">${logo(48)}<h1>NIR Reading Adventure™</h1><p class="tag">Read. Explore. Collect. Understand.</p>
<label class="sm">CEFR level<select id="lvsel">${['A1','A2','B1','B2'].map(l=>`<option ${l===sv.sel?'selected':''}>${l}</option>`).join('')}</select></label>
<label class="sm">Interface language<select id="lang"><option value="en" ${sv.lang==='en'?'selected':''}>English</option><option value="fa" ${sv.lang==='fa'?'selected':''}>فارسی</option><option value="tr" ${sv.lang==='tr'?'selected':''}>Türkçe</option></select></label>
<button class="btn pri" data-a="start" data-l="${sv.sel}">${t('play')} ${sv.sel}</button>
<div class="row"><button class="btn" data-a="levels">${t('levels')}</button><button class="btn" data-a="snd">${t('sound')}: ${sv.snd?'On':'Off'}</button></div>
<p class="sm" ${sv.lang==='fa'?'dir="rtl"':''}>${t('how')}</p>
<p class="sm">Keyboard: ← → or A D to move · Space or ↑ to jump · Esc to pause. Touch: use the on-screen buttons.</p>
${rc?`<div class="fb">${t('sure')}</div><div class="row"><button class="btn" data-a="rcy">${t('yes')}</button><button class="btn" data-a="rcn">${t('cancel')}</button></div>`:`<button class="btn" data-a="rc">${t('reset')}</button>`}${credit()}</div>`,
  levels:()=>`<div class="card"><h2>${t('levels')}</h2>${['A1','A2','B1','B2'].map(l=>`<button class="btn" data-a="start" data-l="${l}"><b>${l}</b> — ${LVD[l]}<small class="sm">${sv.done[l]?'✓ Completed':'Not completed yet'} · Best score: ${sv.best[l]||'—'}</small></button>`).join('')}<button class="btn" data-a="menu">${t('menu')}</button></div>`,
  read:()=>readHTML(),
  pause:()=>`<div class="card"><h2>${t('pause')}</h2><button class="btn pri" data-a="resume">${t('resume')}</button><button class="btn" data-a="restart">${t('restart')}</button><button class="btn" data-a="snd">${t('sound')}: ${sv.snd?'On':'Off'}</button><button class="btn" data-a="menu">${t('menu')}</button></div>`,
  done:()=>`<div class="card">${logo(36)}<h1>Level ${lv} complete!</h1><p class="tag">Badge earned: Reader ${lv} 🏅</p><table>
<tr><td>Platform score</td><td><b>${score}</b></td></tr><tr><td>Reading points</td><td><b>${rp}</b></td></tr><tr><td>Total (best ${sv.best[lv]})</td><td><b>${score+rp}</b></td></tr>
<tr><td>Books collected</td><td><b>${books}/${BK.length}</b></td></tr><tr><td>Vocabulary tokens</td><td><b>${toks}/3</b></td></tr>
<tr><td>Questions answered</td><td><b>${qT}</b></td></tr><tr><td>First-attempt accuracy</td><td><b>${acc}%</b></td></tr><tr><td>Final accuracy (max 2 tries)</td><td><b>${fin}%</b></td></tr></table>
<p>${acc>=78?'Strength: you found details and ideas accurately on the first try.':'Strength: you used hints and kept going until you understood.'}</p>
<p>Next step: ${acc<60?'before answering, reread the passage and find the exact sentence that proves your choice.':'replay aiming for 9/9 on the first try, or try the next level.'}</p>
<p class="sm">This is game practice feedback only — not an official CEFR assessment.</p>
<button class="btn pri" data-a="start" data-l="${lv}">Replay level</button><button class="btn" data-a="levels">Select another level</button>${credit()}</div>`,
  over:()=>`<div class="card"><h1>Out of lives</h1><p>Every reader stumbles. Your reading answers are not lost — try the level again.</p><button class="btn pri" data-a="start" data-l="${lv}">${t('retry')}</button><button class="btn" data-a="menu">${t('menu')}</button></div>`};
  ov.dir=sv.lang==='fa'?'rtl':'ltr';ov.innerHTML=(H[st]||H.menu)();
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;sfx(500,.05);
  if(a==='start')start(b.dataset.l);else if(a==='levels')setState('levels');else if(a==='menu'){rc=false;setState('menu')}
  else if(a==='snd'){sv.snd=sv.snd?0:1;save();render()}else if(a==='rc'){rc=true;render()}else if(a==='rcn'){rc=false;render()}
  else if(a==='rcy'){sv.best={};sv.done={};rc=false;save();render()}
  else if(a==='resume')setState('play');else if(a==='restart')start(lv);
  else if(a==='listen')speak(rd.c.d[1]);else if(a==='opt')answer(+b.dataset.i);
  else if(a==='next'){if(rd.qi<rd.c.d[2].length-1){rd.qi++;prepQ();render();ov.scrollTop=0}else{rd.c.s=2;hudU();toast('Reading complete — keep going!');setState('play')}}
});
ov.addEventListener('change',e=>{if(e.target.id==='lvsel'){sv.sel=e.target.value;save();render()}if(e.target.id==='lang'){sv.lang=e.target.value;save();render()}});

/* ===== Input ===== */
const togglePause=()=>{if(st==='play')setState('pause');else if(st==='pause')setState('play')};
$('#hp').addEventListener('click',togglePause);
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j'};
addEventListener('keydown',e=>{if(e.code==='Escape'){togglePause();return}if(st!=='play')return;const k=KM[e.code];if(!k)return;e.preventDefault();if(k==='j'&&!K.j)K.jp=1;K[k]=1});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)K[k]=0});
addEventListener('blur',()=>{K.l=K.r=K.j=K.jp=0});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st==='play')setState('pause')});
ctl.addEventListener('contextmenu',e=>e.preventDefault());
/* iPhone Safari ignores user-scalable=no: block pinch / double-tap zoom ONLY while playing, so menus and reading text stay zoomable */
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>{if(st==='play')e.preventDefault()}));
document.addEventListener('touchmove',e=>{if(st==='play'&&(e.touches.length>1||e.target.closest('#ctl,#g,#hud')))e.preventDefault()},{passive:false});
let lastTap=0;document.addEventListener('touchend',e=>{const n=Date.now();if(st==='play'&&n-lastTap<350&&e.target.closest('#ctl,#g'))e.preventDefault();lastTap=n},{passive:false});
document.addEventListener('dblclick',e=>{if(st==='play')e.preventDefault()});
ctl.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}if(k==='j'&&!K.j)K.jp=1;K[k]=1;b.classList.add('on')});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{K[k]=0;b.classList.remove('on')}))});

/* ===== Rendering (bright cartoon 2.5D look) ===== */
function size(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d|0;cv.height=innerHeight*d|0;sc=Math.min(cv.height/450,cv.width/400);VW=cv.width/sc;OY=(cv.height-450*sc)/2}
addEventListener('resize',size);addEventListener('orientationchange',()=>setTimeout(size,200));
const rr=(x,y,w,h,r)=>{cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h)};
const DEC=[];for(let x=140,i=0;x<L;x+=150+(i*53%90),i++)if(PL.some(p=>p.y===380&&x>p.x+40&&x<p.x+p.w-40))DEC.push({x,t:i%3});
const pg=$('#pg');let lastPc=-1;
function box(x,y,w,h,d,f,t,s){const dy=d*.6;cx.fillStyle=f;cx.fillRect(x,y,w,h);cx.fillStyle=t;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+d,y-dy);cx.lineTo(x+w+d,y-dy);cx.lineTo(x+w,y);cx.fill();cx.fillStyle=s;cx.beginPath();cx.moveTo(x+w,y);cx.lineTo(x+w+d,y-dy);cx.lineTo(x+w+d,y+h-dy);cx.lineTo(x+w,y+h);cx.fill()}
function hills(par,base,amp,fr,col,ph){cx.fillStyle=col;cx.beginPath();cx.moveTo(0,1200);for(let sx=0;sx<=VW+24;sx+=24){const wx=sx+cam*par;cx.lineTo(sx,base-(Math.sin(wx*fr+ph)*amp+Math.sin(wx*fr*2.3+1)*amp*.4))}cx.lineTo(VW+24,1200);cx.fill()}
function tree(x,t){const y=370;cx.fillStyle='#7a4a2b';cx.fillRect(x-3,y-34,6,34);cx.fillStyle=t===1?'#ff8fb1':'#2f9e6b';cx.beginPath();cx.arc(x,y-42,17,0,7);cx.fill();cx.fillStyle=t===1?'#ffb5cb':'#52c783';cx.beginPath();cx.arc(x-4,y-47,11,0,7);cx.fill()}
function draw(ts){
  if(!W)return;
  const w=cv.width,h=cv.height,T=ts/1000,f=Math.max(0,Math.min(5,(cam+VW/2)/900)),a=f|0,b=Math.min(5,a+1),u=f-a,sk=k=>mix(SKY[a][k],SKY[b][k],u),hl=k=>mix(HL[a][k],HL[b][k],u),bob=RM?0:Math.sin(T*3)*3,cl=cam-40,cr=cam+VW+40;
  cx.setTransform(1,0,0,1,0,0);const g=cx.createLinearGradient(0,OY,0,OY+380*sc);g.addColorStop(0,sk(0));g.addColorStop(.55,sk(1));g.addColorStop(1,sk(2));cx.fillStyle=g;cx.fillRect(0,0,w,h);
  cx.setTransform(sc,0,0,sc,0,OY);
  cx.fillStyle='rgba(255,240,180,.25)';cx.beginPath();cx.arc(VW*.78,84,46,0,7);cx.fill();cx.fillStyle='rgba(255,240,180,.5)';cx.beginPath();cx.arc(VW*.78,84,32,0,7);cx.fill();cx.fillStyle='#fff6c8';cx.beginPath();cx.arc(VW*.78,84,22,0,7);cx.fill();
  cx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<5;i++){const x=((i*230-cam*.12+(RM?0:T*8))%(VW+320)+(VW+320))%(VW+320)-160,y=60+(i*37%70);cx.beginPath();cx.ellipse(x,y,34,11,0,0,7);cx.ellipse(x+20,y-8,22,10,0,0,7);cx.ellipse(x-20,y-4,20,8,0,0,7);cx.fill()}
  hills(.1,315,42,.006,hl(0),0);hills(.22,340,35,.01,hl(1),2);hills(.4,362,25,.016,hl(2),4);
  cx.setTransform(sc,0,0,sc,-Math.round(cam*sc),OY);
  for(const d of DEC)if(d.x>cl&&d.x<cr)tree(d.x,d.t);
  for(const p of PL){if(p.x+p.w<cl||p.x>cr)continue;
    if(p.y===380){box(p.x,380,p.w,1000,22,'#9a5c3a','#62d36e','#6f3f28');cx.fillStyle='#3fae55';cx.fillRect(p.x,380,p.w,7);cx.fillStyle='rgba(0,0,0,.12)';for(let x=Math.max(p.x,cl);x<Math.min(p.x+p.w,cr);x+=46)cx.fillRect(x+6,402+(x%3)*14,18,5)}
    else{box(p.x,p.y,p.w,18,14,'#b26b3e','#62d36e','#7d4527');cx.fillStyle='#3fae55';cx.fillRect(p.x,p.y,p.w,4)}}
  const ok=keys>=1&&cps.every(c=>c.s===2),fx=GATE+80;
  cx.fillStyle='#e8e8f5';cx.fillRect(fx-2,262,5,112);cx.fillStyle='#ffc93c';cx.beginPath();cx.arc(fx,260,5,0,7);cx.fill();cx.fillStyle='#ff3d5a';cx.beginPath();cx.moveTo(fx+3,266);cx.lineTo(fx+46+(RM?0:Math.sin(T*6)*3),278);cx.lineTo(fx+3,290);cx.fill();
  for(let r=0;r<2;r++)for(let c=0;c<6;c++){cx.fillStyle=(r+c)%2?'#222':'#fff';cx.fillRect(fx-18+c*6,368+r*6,6,6)}
  cx.fillStyle=ok?'#ffc93c':'#6b5bd6';rr(GATE,290,60,90,12);cx.fill();cx.fillStyle='#14123a';rr(GATE+10,304,40,76,10);cx.fill();
  cx.textAlign='center';cx.textBaseline='middle';cx.font='800 13px system-ui,sans-serif';cx.fillStyle='rgba(20,20,70,.7)';rr(GATE-6,262,72,22,11);cx.fill();cx.fillStyle='#fff';cx.fillText(ok?'OPEN ✓':'LOCKED',GATE+30,274);
  for(const c of cps){if(c.x<cl||c.x>cr)continue;const d=c.s===2;cx.fillStyle='#e8e8f5';cx.fillRect(c.x-1.5,324,3,50);cx.fillStyle=d?'#2fa24f':'#ffc93c';cx.beginPath();cx.arc(c.x,320,11,0,7);cx.fill();cx.fillStyle=d?'#fff':'#3a2200';cx.font='800 14px system-ui,sans-serif';cx.fillText(d?'✓':'?',c.x,321)}
  for(const x of SPK){if(x<cl||x>cr)continue;for(let i=0;i<3;i++){const sx=x+i*12;cx.fillStyle='#cfd6ea';cx.beginPath();cx.moveTo(sx,380);cx.lineTo(sx+6,363);cx.lineTo(sx+12,380);cx.fill();cx.fillStyle='#7f89ad';cx.beginPath();cx.moveTo(sx+6,363);cx.lineTo(sx+12,380);cx.lineTo(sx+7,380);cx.fill()}}
  for(const b of bks){if(b.got||b.x<cl||b.x>cr)continue;const y=b.y+bob;cx.fillStyle='rgba(255,216,74,.28)';cx.beginPath();cx.arc(b.x,y,15,0,7);cx.fill();cx.fillStyle='#e29a10';cx.fillRect(b.x-10,y-9,20,18);cx.fillStyle='#ffd84a';cx.fillRect(b.x-7,y-9,17,18);cx.fillStyle='#fff3a8';cx.fillRect(b.x-4,y-5,10,2);cx.fillRect(b.x-4,y,10,2)}
