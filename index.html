<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a2466">
<title>NIR Grammar Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#171235;color:#fff;font:16px/1.4 Fredoka,Vazirmatn,system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#171235}
canvas{display:block;background:#171235;max-width:100%;max-height:100%}
#ov{position:fixed;inset:0;display:flex;overflow-y:auto;overflow-x:hidden;background:rgba(20,15,46,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:5;padding:26px 14px;align-items:flex-start;justify-content:center}
#ov.play{display:none}
.card{position:relative;max-width:540px;width:100%;margin:auto;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:26px 22px 20px;backdrop-filter:blur(16px);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(255,216,74,.55),rgba(255,122,61,0) 35%,rgba(143,110,255,.4) 70%,rgba(255,216,74,.4));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.logo{width:56px;height:56px;border-radius:16px;margin:0 auto 6px;background:linear-gradient(145deg,#ffd84a,#ff7a3d);display:flex;align-items:center;justify-content:center;font:800 26px Fredoka,sans-serif;color:#2a1a00;box-shadow:0 8px 0 rgba(0,0,0,.22),0 14px 26px rgba(255,122,61,.35)}
.card h1{font-size:30px;margin:4px 0 2px;background:linear-gradient(90deg,#ffd84a,#ff7a3d,#ffd84a);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;filter:drop-shadow(0 2px 8px rgba(255,150,60,.35));animation:shine 5s linear infinite}
@keyframes shine{to{background-position:220% center}}
.card h2{font-size:20px;margin:0 0 10px}
.sub{color:#ffd84a;font-weight:600;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.btn{appearance:none;border:none;border-radius:16px;padding:13px 18px;font:700 15px Fredoka,Vazirmatn,sans-serif;background:linear-gradient(180deg,#ff9a4a,#ff6a2d);color:#fff;cursor:pointer;box-shadow:0 6px 0 #c44f17,0 10px 18px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c44f17}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.btn.sec{background:rgba(255,255,255,.1);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:14px 0}
.lvb{border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 8px 10px;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));color:#fff;font:700 13px Fredoka,Vazirmatn,sans-serif;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:82px;transition:transform .12s,box-shadow .12s}
.lvb:not([disabled]):hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(255,180,80,.18),inset 0 1px 0 rgba(255,255,255,.2)}
.lvb:not([disabled]):active{transform:translateY(1px)}
.lvb[disabled]{opacity:.42;cursor:default}
.lvb b{font-size:14px}
.lvb span{font-weight:400;font-size:11.5px;opacity:.85}
.lvb small{font-size:10.5px;color:#ffd84a}
.langRow{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.langRow button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:6px 14px;font:600 13px Fredoka,Vazirmatn,sans-serif;cursor:pointer}
.langRow button.on{background:#ffd84a;color:#3a2200;border-color:#ffd84a}
#hud{position:fixed;top:0;left:0;right:0;display:none;align-items:flex-start;justify-content:space-between;padding:10px;pointer-events:none;z-index:4}
.pill{background:rgba(20,15,50,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:14px;padding:7px 13px;display:flex;align-items:center;gap:6px;font-weight:700;pointer-events:auto;box-shadow:0 6px 16px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12)}
#hearts span{color:#ff4d6d;font-size:16px;transition:transform .15s}
#hearts.pop span{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
#build{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(20,15,50,.55);backdrop-filter:blur(6px);border-radius:14px;padding:6px 10px;display:none;font:700 13px Fredoka,Vazirmatn,sans-serif;letter-spacing:.2px;max-width:92vw;white-space:nowrap;overflow-x:auto;overflow-y:hidden;gap:5px;align-items:center}
#build::-webkit-scrollbar{display:none}
.wchip{display:inline-flex;align-items:center;justify-content:center;padding:4px 9px;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.4);margin:0 2px}
.wchip.on{background:linear-gradient(180deg,#ffe08a,#ffb93c);color:#2a1a00;border-color:transparent;box-shadow:0 2px 0 rgba(0,0,0,.18)}
@keyframes pillpop{0%{transform:scale(1.28)}100%{transform:scale(1)}}
.pill.pop{animation:pillpop .28s ease-out}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(45,34,96,.92),rgba(30,22,68,.92));border:1px solid rgba(255,216,74,.35);box-shadow:0 8px 20px rgba(0,0,0,.35);padding:8px 18px;border-radius:14px;font-weight:700;display:none;z-index:6;max-width:88vw;text-align:center;font-size:13.5px}
#ctl{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:16px;z-index:4;pointer-events:none}
.pad{display:flex;gap:10px;pointer-events:auto}
.cbtn{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
#jp{width:72px;height:72px;border-radius:50%;background:linear-gradient(180deg,#ff9a4a,#ff6a2d);color:#fff;font:800 13px Fredoka,sans-serif;border:none;box-shadow:0 6px 0 #c44f17;pointer-events:auto}
#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,30,.68);z-index:7;padding:16px}
.gcard{max-width:420px;width:100%;background:rgba(32,24,70,.92);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:20px;text-align:center}
.gcard .q{font-size:17px;margin-bottom:14px;line-height:1.6}
.gcard .q b{color:#ffd84a}
.opt{display:block;width:100%;margin:7px 0;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:700 15px Fredoka,Vazirmatn,sans-serif;cursor:pointer}
.opt.ok{background:#2fa24f;border-color:#2fa24f}
.opt.bad{background:#c0415a;border-color:#c0415a}
.gmsg{min-height:20px;font-size:13px;margin-top:8px;color:#ffd84a}
#rule{display:none;margin-top:10px;background:rgba(255,216,74,.12);border:1px solid rgba(255,216,74,.4);border-radius:14px;padding:12px;text-align:start;font-size:13.5px;line-height:1.7}
[dir=rtl] .gcard,[dir=rtl] .card{text-align:center}
[dir=rtl] #rule{text-align:right}
@media(max-width:420px){.card h1{font-size:25px}.lvb{min-height:68px}}
</style>
</head>

<div id="ov"><div class="card" id="oc"></div></div>

let state='menu',cur=0,cam=0,T=0,last=0,shake=0;
let L=0;
let SOL=[],spikeL=[],gatesX=[],enemies=[];
let p={x:60,y:GY,vx:0,vy:0,f:1,g:true,ph:0,inv:0,coy:0,buf:0,sq:0,gy:GY,jant:0,idle:0,happy:0,dt:0};
let hearts=3,score=0,words=[],gateIdx=0,gatesPassed=[],toastT=0,toastS='',winT=0;

function buildWorld(){
  const lv=LV[cur];
  const gateCount=lv.gates.length;
  words=[];let x=360;const sentEnd=[];
  lv.sentences.forEach((sent,si)=>{
    sent.forEach((w,wi)=>{x+=72+((wi*13)%18);words.push({x,y:GY-34-((wi%2)?8:0),w,si,wi,got:false});});
    sentEnd.push(x);x+=170;
  });
  gatesX=[];for(let i=0;i<gateCount&&i<sentEnd.length;i++)gatesX.push(Math.round(sentEnd[i]+85));
  gatesPassed=lv.gates.map(()=>false);
  L=x+260;
  SOL=[{x:0,y:GY,w:L,h:300,g:1}];
  const plats=[[420,214,90],[1060,206,90],[1720,210,90],[2380,206,90],[3040,210,90]];
  for(const q of plats)if(q[0]<L-260)SOL.push({x:q[0],y:q[1],w:q[2],h:16,k:1});
  spikeL=[[640,34],[1500,34],[2400,34]].filter(s=>s[0]<L-300&&!gatesX.some(g=>Math.abs(g-s[0])<70)&&!words.some(w=>Math.abs(w.x-s[0])<50));
  enemies=[];
  gatesX.forEach((gx,i)=>{
    if(i%2!==0)return;
    const zoneStart=gx+26,zoneEnd=sentEnd[i]+170-14;
    if(zoneEnd-zoneStart>30&&!spikeL.some(s=>Math.abs(s[0]-((zoneStart+zoneEnd)/2))<90))
      enemies.push({x0:zoneStart,x1:zoneEnd,x:(zoneStart+zoneEnd)/2,dir:1,alive:true,ph:Math.random()*6,kind:cur%3});
  });
}
function reset(i){
  cur=i;
  buildWorld();
  p={x:60,y:GY,vx:0,vy:0,f:1,g:true,ph:0,inv:0,coy:0,buf:0,sq:0,gy:GY,jant:0,idle:0,happy:0,dt:0};
  hearts=3;score=0;gateIdx=0;toastT=0;winT=0;cam=0;gateOpenIdx=-1;parts=[];
  inp.l=inp.r=inp.j=0;
  words.forEach(w=>w.got=false);
  const gateEl=$('#gate');if(gateEl)gateEl.style.display='none';
}
const inp={l:0,r:0,j:0};
function key(k,v){if(k==='ArrowLeft'||k==='a')inp.l=v;else if(k==='ArrowRight'||k==='d')inp.r=v;else if(k===' '||k==='ArrowUp'||k==='w'){if(v&&state==='play')p.buf=.13;inp.j=v;}}
const kn=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{if(e.repeat)return;if(state==='play'||state==='menu')key(kn(e),1);});
addEventListener('keyup',e=>key(kn(e),0));
function holdBtn(id,on,off){const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();on();});
  el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off);}
holdBtn('#bl',()=>inp.l=1,()=>inp.l=0);
holdBtn('#br',()=>inp.r=1,()=>inp.r=0);
holdBtn('#jp',()=>{if(state==='play')p.buf=.13;inp.j=1;},()=>inp.j=0);

/* ---------- audio ---------- */
let AC,MG,mTim=0,mNext=0,mStep=0;
const actx=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
function nt(f,t,d,ty,v){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05);}
const MEL=[0,-1,2,4,-1,2,0,-1,4,-1,2,0,-1,2,4,7,-1,4,2,0,-1,2,0,-1,7,-1,4,2,-1,0,2,-1];
function mSched(){if(!AC||!MG)return;const bpm=112,sp=60/bpm/2,sc=[0,2,4,5,7,9,11,12],r=220,hz=n=>r*Math.pow(2,n/12),ch=[[0,4,7],[5,9,12],[7,11,14],[0,4,7]];
  while(mNext<AC.currentTime+.25){const s=mStep%32,bar=s>>3,b=s&7,c=ch[bar];
    if(b===0||b===4)nt(hz(c[0]-12),mNext,sp*3.4,'sine',.5);
    nt(hz(c[b%3]),mNext,sp*.85,'triangle',.08);
    const d=MEL[s];if(d>=0)nt(hz(sc[d%sc.length]+12),mNext,sp*1.5,'square',.1);
    mNext+=sp;mStep++;}
}
function musOn(vol){try{actx();if(!MG){MG=AC.createGain();MG.gain.value=0;MG.connect(AC.destination);}if(!mTim){mNext=AC.currentTime+.05;mStep=0;mTim=setInterval(mSched,60);}MG.gain.setTargetAtTime(vol,AC.currentTime,.2);}catch(e){}}
function musOff(){if(MG)try{MG.gain.setTargetAtTime(0,AC.currentTime,.25);}catch(e){}}
function jingle(notes,ty,v,gap){try{const a=actx(),t=a.currentTime;notes.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),s=t+i*(gap||.09);o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.14,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+.3);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.35);});}catch(e){}}
const SND={word:()=>jingle([880,1174]),sent:()=>jingle([523,659,784,1047]),ok:()=>jingle([659,988]),bad:()=>jingle([294,220],'sawtooth',.1,.14),win:()=>jingle([523,659,784,1047,784,1047,1319],'triangle',.16,.12),hurt:()=>jingle([300,200],'sawtooth',.1,.1)};

/* ---------- physics ---------- */
function update(dt){
  const tgt=(inp.r-inp.l)*168;
  p.vx+=(tgt-p.vx)*Math.min(1,dt*(p.g?14:11));
  if(tgt)p.f=tgt>0?1:-1;
  p.coy=p.g?.1:p.coy-dt;p.buf-=dt;p.inv-=dt;
  p.happy=Math.max(0,p.happy-dt);if(p.g&&Math.abs(p.vx)<15&&!inp.l&&!inp.r)p.idle+=dt;else p.idle=0;
  if(p.jant>0){p.jant=Math.max(0,p.jant-dt);p.sq=.22;if(p.jant<=0){p.vy=-430;p.g=false;p.coy=0;p.buf=0;p.sq=-.3;sfxJump();}}
  else if(p.buf>0&&p.coy>0){p.jant=.045;p.sq=.22;}
  if(!inp.j&&p.vy<-160)p.vy=-160;
  p.vy=Math.min(p.vy+1150*dt,720);
  p.x+=p.vx*dt;
  for(const s of SOL){if(s.k&&p.x+11>s.x&&p.x-11<s.x+s.w&&p.y>s.y&&p.y-34<s.y+s.h){p.x=(p.vx>0)?s.x-11:s.x+s.w+11;p.vx=0;}}
  p.x=Math.max(12,Math.min(L,p.x));
  gatesX.forEach((gx,i)=>{if(!gatesPassed[i]&&p.x+11>gx-6&&p.x<gx+6){p.x=gx-12;p.vx=0;openGate(i);}});
  const wasG=p.g,pv=p.vy;p.g=false;
  p.y+=p.vy*dt;
  for(const s of SOL){if(p.x+11>s.x&&p.x-11<s.x+s.w&&p.y>s.y&&p.y-34<s.y+s.h){if(p.vy>=0){p.y=s.y;p.g=true;p.gy=s.y;}else p.y=s.y+s.h+34;p.vy=0;}}
  if(p.g&&!wasG&&pv>250){p.sq=.3;}
  if(p.sq)p.sq*=Math.pow(.001,dt);
  if(p.g&&Math.abs(p.vx)>20)p.ph+=dt*(8+Math.abs(p.vx)*.03);
  if(p.y>H+60){hurt();p.x=Math.max(12,p.x-80);p.y=GY;p.vx=p.vy=0;p.g=true;p.inv=1.4;}
  for(const [sx,w] of spikeL)if(p.y>GY-14&&p.x+8>sx&&p.x-8<sx+w)hurt();
  for(const en of enemies){
    if(!en.alive)continue;
    en.x+=en.dir*42*dt;en.ph+=dt*6;
    if(en.x<=en.x0){en.x=en.x0;en.dir=1;}else if(en.x>=en.x1){en.x=en.x1;en.dir=-1;}
    const ex=en.x,ew=13,eh=20,etop=GY-eh;
    if(p.x+10>ex-ew&&p.x-10<ex+ew&&p.y>etop-4){
      if(p.vy>0&&p.y<etop+12){en.alive=false;p.vy=-330;p.sq=.3;score+=30;p.happy=.4;SND.ok();spawnBurst(ex,etop);spawnText(ex,etop-6,'+30');}
      else hurt();
    }
  }
  // word collect (only the current sentence, in order)
  const cs=curSentence();
  for(const wd of words){if(wd.got||wd.si!==cs)continue;if(wd.wi!==sentenceProgress(wd.si))continue;
    if(Math.abs(wd.x-p.x)<26&&Math.abs(wd.y-(p.y-20))<30){wd.got=true;score+=15;p.happy=.4;SND.word();spawnBurst(wd.x,wd.y);spawnText(wd.x,wd.y-6,'+15');checkSentence(wd.si);}}
  if(state!=='play')return;
  if(p.x>=L-20){
    if(allDone())finishLevel(true);
    else if(toastT<=0){toastS=tx('finishFirst');toastT=2;}
  }
  cam+=(Math.max(0,Math.min(L-W,p.x-W*.35))-cam)*Math.min(1,dt*6);
}
function sentenceProgress(si){let n=0;for(const wd of words)if(wd.si===si&&wd.got)n++;return n;}
function curSentence(){
  const lv=LV[cur];
  if(!words.length)return 0;
  for(let si=0;si<lv.sentences.length;si++)
    if(!lv.sentences[si].every((_,wi)=>words.find(w=>w.si===si&&w.wi===wi)?.got))return si;
  return -1;
}
function allDone(){return gatesPassed.every(x=>x)&&words.every(w=>w.got);}
function hurt(){if(p.inv>0)return;hearts--;p.inv=1.3;SND.hurt();shake=.25;const hp=$('#hearts');hp.classList.remove('pop');void hp.offsetWidth;hp.classList.add('pop');if(hearts<=0)finishLevel(false);}
function sfxJump(){jingle([520],'square',.08,.01);}
function spawnBurst(x,y){parts.push({x,y,l:1,vx:0,vy:0});}
function spawnText(x,y,txt){parts.push({x,y,l:1,vy:-26,txt});}
let parts=[];

function checkSentence(si){
  const lv=LV[cur],done=lv.sentences[si].every((_,wi)=>words.find(w=>w.si===si&&w.wi===wi)?.got);
  if(done){SND.sent();toastS=tx('sentDone')+' "'+lv.sentences[si].join(' ')+'"';toastT=2.4;score+=40;}
}

/* ---------- grammar gate ---------- */
let gateOpenIdx=-1;
function openGate(i){
  if(gateOpenIdx===i||gatesPassed[i])return;gateOpenIdx=i;
  inp.l=inp.r=inp.j=0;
  const lv=LV[cur],g=lv.gates[i];
  $('#gq').innerHTML=tx('gate')+'<br><br><b>'+g.q.replace('___','<b style="color:#ff9a4a">___</b>')+'</b>';
  const box=$('#gopts');box.innerHTML='';let answered=false,missed=false;
  const order=g.opts.map((o,idx)=>idx).sort(()=>Math.random()-.5);
  order.forEach(idx=>{const b=document.createElement('button');b.className='opt';b.textContent=g.opts[idx];
    b.onclick=()=>{if(answered)return;answered=true;
      if(idx===g.a){b.classList.add('ok');$('#gmsg').textContent='✓';SND.ok();gatesPassed[i]=true;score+=60;
        setTimeout(()=>{$('#gate').style.display='none';gateOpenIdx=-1;if(state==='gate'){state='play';last=performance.now();}},650);}
      else{b.classList.add('bad');$('#gmsg').textContent=g[lang]||g.en;SND.bad();if(!missed){missed=true;hurt();}answered=false;setTimeout(()=>b.classList.remove('bad'),500);}
    };box.appendChild(b);});
  $('#gmsg').textContent='';
  $('#gate').style.display='flex';state='gate';
}

/* ---------- draw ---------- */
function shade(h,pr){const n=parseInt(h.slice(1),16),f=pr<0?0:255,t=Math.abs(pr)/100,r=n>>16,g=n>>8&255,b=n&255;return '#'+(0x1000000+(Math.round((f-r)*t)+r<<16)+(Math.round((f-g)*t)+g<<8)+(Math.round((f-b)*t)+b)).toString(16).slice(1);}
function mix(a,b,t){const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16),xr=x>>16,xg=x>>8&255,xb=x&255,yr=y>>16,yg=y>>8&255,yb=y&255;return '#'+(0x1000000+(Math.round(xr+(yr-xr)*t)<<16)+(Math.round(xg+(yg-xg)*t)<<8)+Math.round(xb+(yb-xb)*t)).toString(16).slice(1);}
function groundShadow(sx,footY,dist,maxDist,bw,bh,alpha){const t=Math.max(0,Math.min(1,dist/maxDist)),w=Math.max(1,bw*(1-t*.6)),h=Math.max(.6,bh*(1-t*.65)),a=alpha*(1-t*.8);if(a<=.015)return;X.fillStyle='rgba(15,14,46,'+a.toFixed(3)+')';X.beginPath();X.ellipse(sx,footY,w,h,0,0,6.3);X.fill();}
function cloud(cx,cy,sc,a){
  X.fillStyle='rgba(40,40,90,'+(a*.12)+')';X.beginPath();X.ellipse(cx+2*sc,cy+10*sc,30*sc,7*sc,0,0,6.3);X.fill();
  const puffs=[[0,2,30,15],[-24,-2,19,13],[24,-4,20,13],[-10,-14,17,11],[11,-15,16,10],[0,-22,13,9]];
  for(const [dx,dy,rx,ry] of puffs){const g=X.createRadialGradient(cx+dx*sc-rx*sc*.3,cy+dy*sc-ry*sc*.4,1,cx+dx*sc,cy+dy*sc,rx*sc*1.1);
    g.addColorStop(0,'rgba(255,255,255,'+Math.min(1,a+.18)+')');g.addColorStop(1,'rgba(226,234,250,'+a+')');
    X.fillStyle=g;X.beginPath();X.ellipse(cx+dx*sc,cy+dy*sc,rx*sc,ry*sc,0,0,6.3);X.fill();}
  X.fillStyle='rgba(255,255,255,'+Math.min(1,a+.3)+')';X.beginPath();X.ellipse(cx-9*sc,cy-17*sc,8*sc,4.4*sc,0,0,6.3);X.fill();
}
function hills(par,base,amp,fr,col){const hg=X.createLinearGradient(0,base-amp*1.3,0,H+12);hg.addColorStop(0,col);hg.addColorStop(1,shade(col,-26));X.fillStyle=hg;
  const pts=[];X.beginPath();X.moveTo(0,H+12);
  for(let sx=0;sx<=W+24;sx+=24){const wx=sx+cam*par,y=base-(Math.sin(wx*fr)*amp+Math.sin(wx*fr*2.2+1)*amp*.35);pts.push([sx,y]);X.lineTo(sx,y);}
  X.lineTo(W+24,H+12);X.fill();
  X.strokeStyle=shade(col,34);X.globalAlpha=.5;X.lineWidth=2;X.beginPath();pts.forEach(([x,y],i)=>i?X.lineTo(x,y):X.moveTo(x,y));X.stroke();X.globalAlpha=1;
  X.strokeStyle=shade(col,-30);X.lineWidth=1;X.globalAlpha=.35;
  for(let i=0;i<pts.length;i+=3){const [x,y]=pts[i];X.beginPath();X.moveTo(x-6,y+10);X.lineTo(x+8,y+16);X.stroke();}
  X.globalAlpha=1;
}
function cliff(par,base,amp,col){
  const seg=34,pts=[];X.beginPath();X.moveTo(0,H+12);
  for(let sx=-10;sx<=W+34;sx+=seg){const wx=sx+cam*par,r=((Math.sin(wx*.011)+1)*.5*.7+(Math.sin(wx*.027+1.3)+1)*.5*.3),y=base-amp*r;pts.push([sx,y]);X.lineTo(sx,y);}
  X.lineTo(W+34,H+12);X.closePath();
  const cg=X.createLinearGradient(0,base-amp,0,H+12);cg.addColorStop(0,shade(col,10));cg.addColorStop(.5,col);cg.addColorStop(1,shade(col,-30));X.fillStyle=cg;X.fill();
  X.strokeStyle=shade(col,40);X.lineWidth=2.4;X.lineJoin='round';X.beginPath();pts.forEach(([x,y],i)=>i?X.lineTo(x,y):X.moveTo(x,y));X.stroke();
  X.strokeStyle='rgba(20,15,10,.22)';X.lineWidth=1.2;
  for(let i=1;i<pts.length-1;i++){const [x,y]=pts[i];X.beginPath();X.moveTo(x,y+3);X.lineTo(x+(i%2?-5:6),y+22+((i*7)%14));X.stroke();}
  X.fillStyle='rgba(120,200,110,.55)';for(let i=0;i<pts.length;i+=2){const [x,y]=pts[i];X.beginPath();X.ellipse(x,y+1,7+((i*5)%5),3,0,0,6.3);X.fill();}
}
function horizon(par,base,h,col){const g=X.createLinearGradient(0,base-h,0,base+26);g.addColorStop(0,col);g.addColorStop(1,shade(col,-8));X.fillStyle=g;X.beginPath();X.moveTo(0,H+12);for(let sx=0;sx<=W+20;sx+=20){const wx=sx+cam*par;X.lineTo(sx,base-((1-Math.abs(Math.sin(wx*.0022+.4)))*h*.85+Math.abs(Math.sin(wx*.008+1.1))*h*.2));}X.lineTo(W+20,H+12);X.fill();}
function tree(sx,ty){const sway=Math.sin(T*1.1+sx*.01)*2.6;X.save();X.translate(sx,GY-2);
  groundShadow(0,2,0,999,20,5,.22);
  const tg=X.createLinearGradient(-4,-50,6,0);tg.addColorStop(0,'#5c381f');tg.addColorStop(1,'#8a5a34');X.fillStyle=tg;
  X.beginPath();X.moveTo(-4,0);X.quadraticCurveTo(-5,-28,-3,-50);X.lineTo(5,-50);X.quadraticCurveTo(6,-28,5,0);X.closePath();X.fill();
  const cols=ty?['#4a8a4f','#8cbc55','#c9e68a']:['#2c8f5f','#4fc27d','#a8ecb0'];
  const cs=ty?[[0,-70,22],[-15,-58,16],[16,-58,15],[0,-86,15],[-8,-82,11]]:[[0,-66,20],[-16,-54,15],[16,-54,14],[0,-82,14]];
  for(const [dx,dy,r] of cs){const gx=dx+sway*.3,gy=dy;X.fillStyle=shade(cols[0],-18);X.beginPath();X.arc(gx+2,gy+3,r,0,6.3);X.fill();}
  for(const [dx,dy,r] of cs){const gx=dx+sway*.3,gy=dy;X.fillStyle=cols[0];X.beginPath();X.arc(gx,gy,r,0,6.3);X.fill();
    const rg=X.createRadialGradient(gx-r*.35,gy-r*.4,1,gx-r*.2,gy-r*.25,r*.95);rg.addColorStop(0,cols[2]);rg.addColorStop(1,'rgba(255,255,255,0)');X.fillStyle=rg;X.beginPath();X.arc(gx,gy,r,0,6.3);X.fill();}
  X.restore();}
function drawSky(){const lv=LV[cur],g=X.createLinearGradient(0,0,0,GY);g.addColorStop(0,lv.sky[0]);g.addColorStop(.55,lv.sky[1]);g.addColorStop(1,lv.sky[2]);X.fillStyle=g;X.fillRect(0,0,W,H);
  const sx=W*.78,sy=54;
  X.fillStyle='rgba(255,230,160,.22)';X.beginPath();X.arc(sx,sy,46,0,6.3);X.fill();
  X.fillStyle='rgba(255,236,180,.45)';X.beginPath();X.arc(sx,sy,30,0,6.3);X.fill();
  X.fillStyle='#fff6c8';X.beginPath();X.arc(sx,sy,16,0,6.3);X.fill();
  for(let i=0;i<4;i++){const cx=((i*230-cam*.12+T*7)%(W+260)+(W+260))%(W+260)-130;cloud(cx,36+(i*31%60),.9,.8);}
  for(let i=0;i<3;i++){const cx=((i*340-cam*.05+T*3)%(W+300)+(W+300))%(W+300)-150;cloud(cx,16+(i*23%26),.55,.4);}
  horizon(.04,200,46,mix(lv.sky[1],lv.hl[0],.42));
  hills(.1,214,30,.007,lv.hl[0]);hills(.25,240,24,.012,lv.hl[1]);
  X.save();X.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){const x0=((i*230+70-cam*.16+Math.sin(T*.3+i*2)*22)%(W+260)+(W+260))%(W+260)-130;
    const g=X.createLinearGradient(x0,0,x0+90,GY);g.addColorStop(0,'rgba(255,246,200,'+(.22+.1*Math.sin(T*.5+i))+')');g.addColorStop(1,'rgba(255,246,200,0)');
    X.fillStyle=g;X.beginPath();X.moveTo(x0,0);X.lineTo(x0+46,0);X.lineTo(x0+130,GY);X.lineTo(x0+58,GY);X.closePath();X.fill();}
  X.restore();
  cliff(.42,272,30,lv.hl[2]);
  X.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<6;i++){const mx=((i*113-cam*.3+T*(5+i%3))%(W+40)+(W+40))%(W+40)-20,my=50+(i*47%170)+Math.sin(T*.8+i)*8;X.fillRect(mx,my,1.6,1.6);}
}
function leafCluster(x,sc,a){X.save();X.translate(x,0);X.scale(sc,sc);
  const cols=['#2c8f5f','#3fae70','#4fc27d'];
  for(const [dx,dy,r,c] of [[0,0,26,0],[-22,10,20,1],[24,8,19,2],[-8,24,17,1],[10,26,16,0]]){
    X.globalAlpha=a;X.fillStyle=cols[c];X.beginPath();X.ellipse(dx,dy,r,r*.72,.2,0,6.3);X.fill();
    X.globalAlpha=a*.5;X.fillStyle='#d8f5c8';X.beginPath();X.ellipse(dx-r*.3,dy-r*.25,r*.4,r*.28,.2,0,6.3);X.fill();}

  <h1>${tx('title')}</h1><div class="sub">${tx('sub')}</div><div class="lvgrid">`;
  LV.forEach((l,i)=>{const open=i<sv.unlocked&&l.unlocked!==false;
    lv+=`<button class="lvb" ${open?'':'disabled'} data-p="${i}"><div style="font-size:20px">${LICON[i]||'✨'}</div><b>${tx('level')} ${i+1}</b><span>${l.nn&&l.nn[lang]?l.nn[lang]:l.topic}</span><small>${open?(sv.best[i+1]?'★ '+sv.best[i+1]:tx('play')):(l.unlocked===false?tx('soon'):tx('locked'))}</small></button>`;});
  lv+='</div><div style="font-size:11px;opacity:.6;margin-top:6px">'+tx('made')+' '+tx('by')+'</div>';
  oc.innerHTML=lv;
  oc.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{lang=b.dataset.l;sv.lang=lang;save();menuScreen();});
  oc.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=+b.dataset.p;if(i<sv.unlocked&&LV[i].unlocked!==false)startLevel(i);});
}
function startLevel(i){reset(i);hvLast=-1;svLast=-1;state='play';show('play');musOn(.45);last=performance.now();}
function finishLevel(win){
  $('#gate').style.display='none';gateOpenIdx=-1;inp.l=inp.r=inp.j=0;
  state=win?'cele':'res';show('');
  if(win){SND.win();sv.best[cur+1]=Math.max(sv.best[cur+1]||0,score);if(cur+1>=sv.unlocked&&cur+1<LV.length&&LV[cur+1].unlocked!==false)sv.unlocked=Math.max(sv.unlocked,cur+2);save();}
  musOff();
  setTimeout(()=>resultScreen(win),win?700:300);
}
function resultScreen(win){
  const lv=LV[cur],oc=$('#oc');
  let html=`<div class="logo">${win?'🏆':'N'}</div><h2>${win?tx('win'):tx('lose')}</h2><div class="sub">${tx('score')}: ${score}</div>`;
  if(win){html+=`<div id="rule" style="display:block"><b>${tx('rule')}:</b><br>${lv.rule[lang]||lv.rule.en}</div>`;}
  html+=`<div class="row"><button class="btn" id="rAgain">${tx('restart')}</button>${(win&&cur+1<LV.length&&LV[cur+1].unlocked!==false)?`<button class="btn" id="rNext">${tx('next')}</button>`:''}<button class="btn ghost" id="rMenu">${tx('menu')}</button></div>`;
  oc.innerHTML=html;show('menu');
  $('#rAgain').onclick=()=>startLevel(cur);
  $('#rMenu').onclick=menuScreen;
  const rn=$('#rNext');if(rn)rn.onclick=()=>startLevel(cur+1);
}

/* ---------- loop ---------- */
function loop(ts){requestAnimationFrame(loop);const dt=Math.max(0,Math.min(.05,(ts-last)/1000||0));last=ts;T+=dt;
  if(state==='play'){update(dt);}
  draw();if(state==='play'||state==='gate')hud();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state==='play'){state='pause';inp.l=inp.r=inp.j=0;musOff();}
  else if(!document.hidden&&state==='pause'){state='play';last=performance.now();musOn(.45);}
});
document.addEventListener('pointerdown',()=>{try{actx();}catch(e){}},{once:true});
menuScreen();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
