function buildWorld(){
  const lv=LV[cur];
  const gateCount=lv.gates.length;
  words=[];let x=360;const sentEnd=[];
  lv.sentences.forEach((sent,si)=>{
    sent.forEach((w,wi)=>{x+=72+((wi*13)%18);words.push({x,y:GY-34-((wi%2)?8:0),w,si,wi,got:false});});
    sentEnd.push(x);x+=170;
  });
  gatesX=[];for(let i=0;i<gateCount&&i<sentEnd.length;i++)gatesX.push(Math.round(sentEnd[i]+85));
  gatesPassed=lv.gates.map(()=>false);
  L=x+260;
  SOL=[{x:0,y:GY,w:L,h:300,g:1}];

  for(const q of plats)if(q[0]<L-260)SOL.push({x:q[0],y:q[1],w:q[2],h:16,k:1});
  spikeL=[[640,34],[1500,34],[2400,34]].filter(s=>s[0]<L-300&&!gatesX.some(g=>Math.abs(g-s[0])<70)&&!words.some(w=>Math.abs(w.x-s[0])<50));
  enemies=[];
  gatesX.forEach((gx,i)=>{
    if(i%2!==0)return;
    const zoneStart=gx+26,zoneEnd=sentEnd[i]+170-14;
    if(zoneEnd-zoneStart>30&&!spikeL.some(s=>Math.abs(s[0]-((zoneStart+zoneEnd)/2))<90))
      enemies.push({x0:zoneStart,x1:zoneEnd,x:(zoneStart+zoneEnd)/2,dir:1,alive:true,ph:Math.random()*6,kind:cur%3});

}

function key(k,v){if(k==='ArrowLeft'||k==='a')inp.l=v;else if(k==='ArrowRight'||k==='d')inp.r=v;else if(k===' '||k==='ArrowUp'||k==='w'){if(v&&state==='play')p.buf=.13;inp.j=v;}}

  if((e.key==='Escape'||e.key==='p'||e.key==='P')&&!e.repeat){

  }

/* ---------- audio ---------- */
let AC,MG,mTim=0,mNext=0,mStep=0;
const actx=()=>{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC};
function nt(f,t,d,ty,v){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05);}
const MEL=[0,-1,2,4,-1,2,0,-1,4,-1,2,0,-1,2,4,7,-1,4,2,0,-1,2,0,-1,7,-1,4,2,-1,0,2,-1];
function mSched(){if(!AC||!MG)return;const bpm=112,sp=60/bpm/2,sc=[0,2,4,5,7,9,11,12],r=220,hz=n=>r*Math.pow(2,n/12),ch=[[0,4,7],[5,9,12],[7,11,14],[0,4,7]];
  while(mNext<AC.currentTime+.25){const s=mStep%32,bar=s>>3,b=s&7,c=ch[bar];
    if(b===0||b===4)nt(hz(c[0]-12),mNext,sp*3.4,'sine',.5);
    nt(hz(c[b%3]),mNext,sp*.85,'triangle',.08);
    const d=MEL[s];if(d>=0)nt(hz(sc[d%sc.length]+12),mNext,sp*1.5,'square',.1);
    mNext+=sp;mStep++;}
}
function musOn(vol){try{actx();if(!MG){MG=AC.createGain();MG.gain.value=0;MG.connect(AC.destination);}if(!mTim){mNext=AC.currentTime+.05;mStep=0;mTim=setInterval(mSched,60);}MG.gain.setTargetAtTime(vol,AC.currentTime,.2);}catch(e){}}
function musOff(){if(MG)try{MG.gain.setTargetAtTime(0,AC.currentTime,.25);}catch(e){}}
function jingle(notes,ty,v,gap){try{const a=actx(),t=a.currentTime;notes.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),s=t+i*(gap||.09);o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v||.14,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+.3);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.35);});}catch(e){}}
const SND={word:()=>jingle([880,1174]),sent:()=>jingle([523,659,784,1047]),ok:()=>jingle([659,988]),bad:()=>jingle([294,220],'sawtooth',.1,.14),win:()=>jingle([523,659,784,1047,784,1047,1319],'triangle',.16,.12),hurt:()=>jingle([300,200],'sawtooth',.1,.1),gem:()=>jingle([1318,1760],'sine',.09,.06)};

/* ---------- physics ---------- */
function update(dt){
  if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;lastM=1;}}
  const tgt=(inp.r-inp.l)*168;
  p.vx+=(tgt-p.vx)*Math.min(1,dt*(p.g?14:11));
  if(tgt)p.f=tgt>0?1:-1;
  p.coy=p.g?.1:p.coy-dt;p.buf-=dt;p.inv-=dt;
  p.happy=Math.max(0,p.happy-dt);if(p.g&&Math.abs(p.vx)<15&&!inp.l&&!inp.r)p.idle+=dt;else p.idle=0;
  if(p.jant>0){p.jant=Math.max(0,p.jant-dt);p.sq=.22;if(p.jant<=0){p.vy=-430;p.g=false;p.coy=0;p.buf=0;p.sq=-.3;sfxJump();}}
  else if(p.buf>0&&p.coy>0){p.jant=.045;p.sq=.22;}
  if(!inp.j&&p.vy<-160)p.vy=-160;
  p.vy=Math.min(p.vy+1150*dt,720);
  p.x+=p.vx*dt;
  for(const s of SOL){if(s.k&&p.x+11>s.x&&p.x-11<s.x+s.w&&p.y>s.y&&p.y-34<s.y+s.h){p.x=(p.vx>0)?s.x-11:s.x+s.w+11;p.vx=0;}}
  p.x=Math.max(12,Math.min(L,p.x));
  gatesX.forEach((gx,i)=>{if(!gatesPassed[i]&&p.x+11>gx-6&&p.x<gx+6){p.x=gx-12;p.vx=0;openGate(i);}});
  if(boss&&!boss.dead){if(p.x>boss.x-70){p.x=boss.x-70;p.vx=0;}if(!boss.fight&&p.x>boss.x-170){boss.fight=true;p.vx=0;openBoss();}}
  const wasG=p.g,pv=p.vy;p.g=false;
  p.y+=p.vy*dt;
  for(const s of SOL){if(p.x+11>s.x&&p.x-11<s.x+s.w&&p.y>s.y&&p.y-34<s.y+s.h){if(p.vy>=0){p.y=s.y;p.g=true;p.gy=s.y;}else p.y=s.y+s.h+34;p.vy=0;}}
  if(p.g&&!wasG&&pv>250){p.sq=.3;for(let i=0;i<5;i++)parts.push({x:p.x+(i-2)*5,y:p.gy-2,l:.6,vx:(i-2)*16,vy:-8-(i%2)*6,d:1});}
  if(p.sq)p.sq*=Math.pow(.001,dt);
  if(p.g&&Math.abs(p.vx)>20)p.ph+=dt*(8+Math.abs(p.vx)*.03);
  dustT-=dt;if(p.g&&Math.abs(p.vx)>110&&dustT<=0){dustT=.1;parts.push({x:p.x-p.f*8,y:p.gy-2,l:.6,vx:-p.f*14,vy:-10,d:1});}
  if(p.y>H+60){hurt();p.x=Math.max(12,p.x-80);p.y=GY;p.vx=p.vy=0;p.g=true;p.inv=1.4;}
  for(const [sx,w] of spikeL)if(p.y>GY-14&&p.x+8>sx&&p.x-8<sx+w)hurt();
  for(const en of enemies){
    if(!en.alive)continue;
    en.x+=en.dir*42*dt;en.ph+=dt*6;
    if(en.x<=en.x0){en.x=en.x0;en.dir=1;}else if(en.x>=en.x1){en.x=en.x1;en.dir=-1;}
    const ex=en.x,ew=13,eh=20,etop=GY-eh;
    if(p.x+10>ex-ew&&p.x-10<ex+ew&&p.y>etop-4){
      if(p.vy>0&&p.y<etop+12){const pt=30*bump();en.alive=false;p.vy=-330;p.sq=.3;score+=pt;p.happy=.4;SND.ok();shake=.3;hitT=.09;vib(20);spawnBurst(ex,etop);spawnBurst(ex,etop+8);spawnText(ex,etop-6,'+'+pt);}
      else hurt();
    }
  }
  // word collect (only the current sentence, in order)
  const cs=curSentence();

  const oc=$('#oc'),es=Object.values(nb);
  let h='<div class="logo">📒</div><h2>'+tx('nb')+'</h2>';
  if(!es.length)h+='<div class="sub">'+tx('nbEmpty')+'</div>';
  else{
    h+='<div class="sub">'+tx('hintRm')+'</div>';
    h+=es.map(e=>{const g=LV[e.l].gates[e.i],lv=LV[e.l];return '<div class="nbi"><small>'+tx('level')+' '+(e.l+1)+' · '+((lv.nn&&lv.nn[lang])||lv.topic)+' · ❌ '+e.w+'</small><div dir="ltr">'+nbFill(g)+'</div><div>'+(g[lang]||g.en)+'</div></div>';}).join('');
    h+='<div class="row"><button class="btn" id="nbP">🎯 '+tx('practice')+'</button></div>';
  }
  h+='<div class="row"><button class="btn ghost" id="nbB">← '+tx('back')+'</button></div>';
  oc.innerHTML=h;
  const p=$('#nbP');if(p)p.onclick=nbPractice;
  $('#nbB').onclick=menuScreen;
}
function nbPractice(){prac={ks:Object.keys(nb).sort(()=>Math.random()-.5).slice(0,5),n:0,ok:0};nbQ();}
function nbQ(){
  const oc=$('#oc');$('#ov').scrollTop=0;
  if(prac.n>=prac.ks.length){
    oc.innerHTML='<div class="logo">🎯</div><h2>'+tx('practice')+'</h2><div class="sub">'+tx('got')+': '+prac.ok+' / '+prac.ks.length+'</div><div class="row">'+(nbCount()?'<button class="btn" id="nbA">↻ '+tx('again')+'</button>':'')+'<button class="btn ghost" id="nbX">← '+tx('back')+'</button></div>';
    const a=$('#nbA');if(a)a.onclick=nbPractice;$('#nbX').onclick=nbScreen;return;
  }
  const k=prac.ks[prac.n],e=nb[k];
  if(!e){prac.n++;nbQ();return;}
  const g=LV[e.l].gates[e.i];let done=false;
  oc.innerHTML='<div class="logo">🎯</div><div class="sub">'+(prac.n+1)+' / '+prac.ks.length+'</div><div dir="ltr" style="font-size:18px;line-height:1.6;margin-bottom:12px">'+g.q.replace('___','<b style="color:#ff9a4a">___</b>')+'</div><div id="nbO"></div><div class="gmsg" id="nbM"></div><div class="row" id="nbN"></div><div class="row"><button class="btn ghost" id="nbX">← '+tx('back')+'</button></div>';
  const box=$('#nbO');
  g.opts.map((o,i)=>i).sort(()=>Math.random()-.5).forEach(i=>{
    const b=document.createElement('button');b.className='opt';b.textContent=g.opts[i];
    b.onclick=()=>{
      if(done)return;done=true;const right=i===g.a;
      if(right){b.classList.add('ok');prac.ok++;e.r++;SND.ok();if(e.r>=2)delete nb[k];}
      else{b.classList.add('bad');e.w++;e.r=0;SND.bad();[...box.children].forEach(c=>{if(c.textContent===g.opts[g.a])c.classList.add('ok');});}
      nbSave();
      $('#nbM').textContent=(right?'✓ ':'')+(g[lang]||g.en);
      const n=document.createElement('button');n.className='btn';n.textContent=tx('next');n.onclick=()=>{prac.n++;nbQ();};$('#nbN').appendChild(n);
    };
    box.appendChild(b);
  });
  $('#nbX').onclick=nbScreen;
}
/* ---------- pause ---------- */
function pauseGame(){
  if(state!=='play')return;
  state='pause';mp=true;inp.l=inp.r=inp.j=0;musOff();try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const lv=LV[cur],oc=$('#oc');
  oc.innerHTML=`<div class="logo">⏸</div><h2>${tx('pause')}</h2><div class="sub">${tx('level')} ${cur+1} · ${lv.nn&&lv.nn[lang]?lv.nn[lang]:lv.topic}</div>
  <div class="row"><button class="btn" id="pResume">${tx('resume')}</button><button class="btn sec" id="pAgain">${tx('restart')}</button><button class="btn ghost" id="pMenu">${tx('menu')}</button></div>`;
  show('menu');
  $('#pResume').onclick=resumeGame;
  $('#pAgain').onclick=()=>startLevel(cur);
  $('#pMenu').onclick=menuScreen;
}
function resumeGame(){
  if(state!=='pause'||!mp)return;
  mp=false;state='play';show('play');musOn(.45);last=performance.now();
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
}
$('#pz').addEventListener('click',pauseGame);
const vzb=$('#vz');vzb.textContent=sv.voice?'🔊':'🔇';
vzb.addEventListener('click',()=>{sv.voice=!sv.voice;save();vzb.textContent=sv.voice?'🔊':'🔇';if(!sv.voice&&window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}vzb.blur();});

/* ---------- loop (capped to ~60fps, paused while phone is in portrait) ---------- */
let lastDraw=0;
function loop(ts){requestAnimationFrame(loop);
  if(ts-lastDraw<15)return;lastDraw=ts;
  const dt=Math.max(0,Math.min(.05,(ts-last)/1000||0));last=ts;T+=dt;
  if(state==='play'){if(hitT>0){hitT-=dt;update(dt*.18);}else update(dt);}
  draw();if(state==='play'||state==='gate')hud();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state==='play'){state='pause';inp.l=inp.r=inp.j=0;musOff();}
  else if(!document.hidden&&state==='pause'&&!mp){state='play';last=performance.now();musOn(.45);}
});
document.addEventListener('pointerdown',()=>{try{actx();}catch(e){}},{once:true});

/* ---------- mobile lock-down (no zoom / scroll / double-tap while playing) ---------- */
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>{if(state==='play')e.preventDefault();}));
document.addEventListener('touchmove',e=>{if(state==='play'&&(e.touches.length>1||e.target.closest('#ctl,#g,#hud')))e.preventDefault();},{passive:false});
let lastTap=0;document.addEventListener('touchend',e=>{const n=Date.now();if(state==='play'&&n-lastTap<350&&e.target.closest('#ctl,#g'))e.preventDefault();lastTap=n;},{passive:false});
document.addEventListener('dblclick',e=>{if(state==='play')e.preventDefault();});
menuScreen();
requestAnimationFrame(loop);
})();
</script>
